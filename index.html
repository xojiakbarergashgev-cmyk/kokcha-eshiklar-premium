<meta name="description" content="Ko'kcha Eshiklar Premium — O'zbekistondagi premium MDF eshiklar. O'z fabrikamiz, Italiya furniturasi, bepul o'lchov va 10 yillik kafolat.">

<body data-page="home">
<div id="site-header"></div>

<!-- HERO -->
<section class="hero">
  <div class="container">
    <div>
      <div class="eye rv" data-i18n="hero.badge"></div>
      <h1 class="rv" style="--d:.1s"><span data-i18n="hero.t1"></span> <em data-i18n="hero.t2"></em></h1>
      <p class="hero-sub rv" style="--d:.2s" data-i18n="hero.sub"></p>
      <div class="hero-btns rv" style="--d:.3s">
        <a href="katalog.html" class="btn btn-gold"><span data-i18n="cta.catalog"></span> <span class="arr">→</span></a>
        <button class="btn btn-line" data-order=""><span data-i18n="cta.measure"></span></button>
      </div>
      <div class="hero-stats rv" style="--d:.4s">
        <div><b data-count="5">5</b><span data-i18n="st.1"></span></div>
        <div><b data-count="500" data-suf="+">500+</b><span data-i18n="st.2"></span></div>
        <div><b data-count="1">1</b><span data-i18n="st.3"></span></div>
        <div><b data-i18n="st.4n"></b><span data-i18n="st.4"></span></div>
      </div>
    </div>
    <!-- Eshik ochiladi va ortidan oila ko'rinadi (rasm: @kokcha.eshiklari.uz Instagram) -->
    <div class="hero-portal rv" style="--d:.25s">
      <div class="portal-glow"></div>
      <div class="portal-frame">
        <div class="portal-pic"><img src="assets/img/hero-oila.jpg" alt="Ko'kcha eshigi ortida oila" class="portal-photo"></div>
        <div class="portal-door"><div class="pd-leaf"><i class="pd-p1"></i><i class="pd-p2"></i><i class="pd-h"></i></div></div>
      </div>
    </div>
  </div>
  <div class="scroll-ind" data-i18n="hero.scroll"></div>
</section>
