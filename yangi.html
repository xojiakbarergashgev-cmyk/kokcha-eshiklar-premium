<header class="v-hdr">

  <div class="v-hdr-r">

    <a class="v-pill dark" href="aloqa.html" data-t="cta.order"></a>
  </div>
</header>

<!-- 1. HERO: o'rtada eshik, ikki yonida ulkan yozuv (qahva namunasidagidek) -->
<section class="v-hero">
  <div class="v-chips" id="vChips" aria-hidden="true"></div>
  <div class="v-hero-in">
    <div class="v-crumb"><span data-t="h.crumb1"></span> <i>›</i> <span data-t="h.crumb2"></span></div>
    <h1 class="v-word l">KO'KCHA</h1>
    <div class="v-door-wrap">
      <div class="v-shadow"></div>
      <img class="v-door" id="vDoor" src="assets/img/products/png/kc02.png" alt="Ko'kcha eshigi">
    </div>
    <h1 class="v-word r" aria-hidden="true" data-t="h.word2"></h1>
    <div class="v-hero-txt">
      <p data-t="h.sub"></p>
      <div class="v-hero-btns">
        <a class="v-pill dark" href="katalog.html" data-t="h.cta"></a>
        <button class="v-circle" id="vNext" aria-label="next">→</button>
      </div>
    </div>
    <div class="v-hero-side">
      <span class="v-num" id="vNum">01 / 06</span>
      <b id="vName">Naqsh</b>
      <span class="v-line"></span>
    </div>
  </div>
</section>

<!-- 2. PASTGA SURING — ESHIK YIG'ILADI (qurilish namunasidagidek) -->
<section class="v-build" id="vBuild">
  <div class="v-build-sticky">
    <div class="v-build-top">
      <span class="v-mono" data-t="b.eye"></span>
      <h2 data-t="b.title"></h2>
      <p data-t="b.sub"></p>
    </div>
    <div class="v-kit" id="vKit">
      <i class="k-stile l"></i><i class="k-stile r"></i>
      <i class="k-rail t"></i><i class="k-rail m"></i><i class="k-rail b"></i>
      <i class="k-panel"></i>
      <i class="k-band"></i>
      <img class="k-final" src="assets/img/products/png/kc02.png" alt="">
    </div>
    <div class="v-build-steps">
      <span data-s="0" data-t="b.s1"></span><span data-s="1" data-t="b.s2"></span><span data-s="2" data-t="b.s3"></span><span data-s="3" data-t="b.s4"></span><span data-s="4" data-t="b.s5"></span>
    </div>
    <div class="v-mono v-scroll" data-t="b.scroll"></div>
  </div>
</section>

<!-- 3. XONALAR: butun ekranli interyer, eshik xonada (interyer namunasidagidek) -->
<section class="v-room" data-room="0">
  <div class="v-room-bg" id="vLiving">
    <img class="on" src="assets/img/portfolio/1.jpg" alt="" data-v="0">
    <img src="assets/img/portfolio/6.jpg" alt="" data-v="1">
    <img src="assets/img/portfolio/7.jpg" alt="" data-v="2">
    <img src="assets/img/portfolio/3.jpg" alt="" data-v="3">
    <img src="assets/img/portfolio/11.jpg" alt="" data-v="4">
    <img src="assets/img/portfolio/13.jpg" alt="" data-v="5">
  </div>
  <div class="v-room-in">
    <span class="v-mono">01 / <span data-t="r1.k"></span></span>
    <h2 data-t="r1.t"></h2>
    <span class="v-mono sm" data-t="r1.s"></span>
    <div class="v-swatch" id="vSwatch">
      <button class="on" data-v="0" style="--c:#f1efe9" data-t="c.1"></button>
      <button data-v="1" style="--c:#2f3e5c" data-t="c.2"></button>
      <button data-v="2" style="--c:#5c2b2e" data-t="c.3"></button>
      <button data-v="3" style="--c:#b3a56b" data-t="c.4"></button>
      <button data-v="4" style="--c:#3b3c37" data-t="c.5"></button>
      <button data-v="5" style="--c:#8a6a4c" data-t="c.6"></button>
    </div>
  </div>
  <span class="v-mono v-room-tag" data-t="r.tag"></span>
</section>
<section class="v-room">
  <div class="v-room-bg"><img class="on" src="assets/img/hero-oila.jpg" alt="" style="object-position:50% 30%"></div>
  <div class="v-room-in">
    <span class="v-mono">02 / <span data-t="r2.k"></span></span>
    <h2 data-t="r2.t"></h2>
    <span class="v-mono sm" data-t="r2.s"></span>
  </div>
  <span class="v-mono v-room-tag" data-t="r.tag"></span>
</section>
<section class="v-room">

</section>
<section class="v-room">

  <div class="v-room-in">
    <span class="v-mono">04 / <span data-t="r4.k"></span></span>
    <h2 data-t="r4.t"></h2>
    <span class="v-mono sm" data-t="r4.s"></span>
    <a class="v-pill light" href="aloqa.html" data-t="r4.cta"></a>

  <span class="v-mono v-room-tag" data-t="r.tag"></span>
