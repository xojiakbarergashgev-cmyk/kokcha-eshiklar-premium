<!-- sarlavha (Arriva uslubi) -->
<header class="v-hdr">

<!-- 1. HERO: o'rtada katta eshik, ostida eshiklar qatori -->
<section class="v-hero">
  <div class="v-hero-l">
    <h1><span data-t="h.t1"></span><br><em data-t="h.t2"></em></h1>
    <div class="v-arrows"><button id="vPrev" aria-label="prev">←</button><button id="vNext2" aria-label="next">→</button></div>
    <p class="v-fact"><b>5</b> <span data-t="h.fact"></span></p>
  </div>
  <div class="v-hero-c">
    <img class="v-door" id="vDoor" src="assets/img/products/png/k1035.png" alt="Ko'kcha eshigi">
    <span class="v-tag" id="vName">1035</span>
  </div>
  <div class="v-hero-r">
    <div class="v-since"><em data-t="h.since1"></em><em data-t="h.since2"></em></div>
    <div class="v-note"><i></i><p data-t="h.sub"></p></div>
    <a class="v-explore" href="katalog.html" data-t="h.cta"></a>
  </div>
  <div class="v-row" id="vRow"></div>
</section>

<!-- 2. ESHIK OCHILADI — ORTIDA UY (Tylko uslubi) -->
<section class="v-portal" id="vPortal">
  <div class="v-portal-sticky">
    <div class="v-portal-scene" id="vScene">
      <div class="v-wall"></div>
      <div class="v-way">
        <img class="v-beyond" src="assets/img/hero-oila.jpg" alt="">

      </div>
      <div class="v-casing"></div>
    </div>
    <div class="v-portal-txt">
      <span class="v-mono" data-t="p.eye"></span>
      <h2 data-t="p.title"></h2>
    </div>
    <span class="v-mono v-portal-hint" data-t="p.hint"></span>
  </div>
</section>

<!-- 3. XONALAR (FORMA uslubi: sarlavha chapda / o'ngda) -->
<section class="v-room">
  <div class="v-room-bg" id="vLiving">
    <img class="on" src="assets/img/portfolio/1.jpg" alt="" data-v="0">
    <img src="assets/img/portfolio/6.jpg" alt="" data-v="1">
    <img src="assets/img/portfolio/7.jpg" alt="" data-v="2">
    <img src="assets/img/portfolio/3.jpg" alt="" data-v="3">
    <img src="assets/img/portfolio/11.jpg" alt="" data-v="4">
    <img src="assets/img/portfolio/13.jpg" alt="" data-v="5">
  </div>
  <div class="v-room-top"><span>KO'KCHA</span><span class="v-mono" data-t="r.tag"></span></div>
  <div class="v-room-in">
    <span class="v-mono">01 / <span data-t="r1.k"></span></span>
    <h2 data-t="r1.t"></h2>
    <span class="v-mono sm" data-t="r1.s"></span>

      <button class="on" data-v="0" style="--c:#f1efe9" data-t="c.1"></button>
      <button data-v="1" style="--c:#2f3e5c" data-t="c.2"></button>

  <div class="v-room-bg"><img class="on" src="assets/img/hero-oila.jpg" alt="" style="object-position:50% 30%"></div>
  <div class="v-room-top"><span>KO'KCHA</span><span class="v-mono" data-t="r.tag"></span></div>
  <div class="v-room-in">
    <span class="v-mono">02 / <span data-t="r2.k"></span></span>

    <span class="v-mono sm" data-t="r2.s"></span>
  </div>
</section>
<section class="v-room">
  <div class="v-room-bg"><img class="on" src="assets/img/portfolio/17.jpg" alt=""></div>

    <h2 data-t="w.title"></h2>
    <p class="v-why-sub" data-t="w.sub"></p>
    <div class="v-why-grid">
      <div><b data-t="w.1t"></b><p data-t="w.1"></p></div>
      <div><b data-t="w.2t"></b><p data-t="w.2"></p></div>
      <div><b data-t="w.3t"></b><p data-t="w.3"></p></div>
    </div>
  </div>

<!-- 5. YAKUN -->
<section class="v-end">
  <span class="v-small" data-t="e.eye"></span>
  <h2><span data-t="e.t1"></span> <em data-t="e.t2"></em></h2>
