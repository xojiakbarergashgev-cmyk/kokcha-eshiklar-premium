<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telefon — Ko'kcha Eshiklar Premium</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: radial-gradient(ellipse at 50% 30%, #1d2a3b, #0b1119 70%); color: #fff; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 40px; overflow-x: hidden; }
  h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: clamp(26px, 4vw, 40px); text-align: center; }
  h1 em { color: #d6b98a; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 18px 0 26px; }
  .bar a, .bar button { font: 700 11px 'Manrope', sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #9aa3b2; border: 1px solid rgba(255,255,255,.14); background: none; padding: 10px 14px; text-decoration: none; cursor: pointer; }
  .bar a:hover, .bar button:hover, .bar .on { color: #fff; border-color: #b8925a; background: #b8925a; }
  .stage { width: 100%; display: flex; justify-content: center; }
  .device { position: relative; flex-shrink: 0; width: 418px; height: 872px; padding: 14px; border-radius: 56px; background: linear-gradient(145deg, #2b2f36, #121418); box-shadow: 0 0 0 2px #3a3f47, 0 50px 90px -30px rgba(0,0,0,.8), 0 0 120px rgba(214,185,138,.12); }
  .device iframe { width: 100%; height: 100%; border: 0; border-radius: 44px; background: #0e1520; display: block; }
  .device::before { content: ""; position: absolute; left: 50%; top: 22px; transform: translateX(-50%); width: 110px; height: 30px; border-radius: 20px; background: #000; z-index: 2; }
  .note { margin-top: 22px; color: #9aa3b2; font-size: 13px; text-align: center; max-width: 520px; }
  .note a { color: #d6b98a; }
</style>
</head>
<body>
  <h1>Ko'kcha Eshiklar — <em>Telefon</em></h1>
  <div class="bar" id="pages">
    <button data-p="index.html" class="on">Bosh sahifa</button>
    <button data-p="katalog.html">Katalog</button>
    <button data-p="mahsulot.html?id=k1033">Mahsulot</button>
    <button data-p="ishlarimiz.html">Ishlarimiz</button>
    <button data-p="biz-haqimizda.html">Biz haqimizda</button>
    <button data-p="aloqa.html">Aloqa</button>
    <a href="ipad.html">iPad →</a>
  </div>
  <div class="stage" id="stage">
    <div class="device" id="device"><iframe id="screen" src="index.html" title="Telefon"></iframe></div>
  </div>
  <p class="note">Bu sahifa saytning telefondagi ko'rinishini ko'rsatadi. Ekran ichida bemalol yurish mumkin. To'liq sayt: <a href="index.html">index.html</a></p>
<script>
  const dev = document.getElementById('device'), stage = document.getElementById('stage'), screen = document.getElementById('screen');
  const BW = dev.offsetWidth, BH = dev.offsetHeight;
  // zoom (transform emas): iframe ichidagi sayt o'z kengligida qoladi va to'g'ri chiziladi
  function fit() {
    const s = Math.min(1, (window.innerWidth - 32) / BW, (window.innerHeight - 170) / BH);
    dev.style.zoom = Math.max(s, .35);
  }
  addEventListener('resize', fit); fit();
  document.getElementById('pages').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#pages button').forEach(x => x.classList.toggle('on', x === b));
    screen.src = b.dataset.p;
  });
</script>
</body>
</html>
